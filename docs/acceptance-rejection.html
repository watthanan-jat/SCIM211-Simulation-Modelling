    &lt;div class=&quot;text-small text-muted ar-batch-note&quot;&gt;Each proposal uses the same 100 reproducible uniform pairs. The first six attempts are excluded. Bars show density among accepted values; the line is the target f.&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;acceptance-rejection-stepper&quot;);
      if (!root) return;

      const plot = root.querySelector(&quot;#ar-plot&quot;);
      const proposalSelect = root.querySelector(&quot;#ar-proposal&quot;);
      const nextButton = root.querySelector(&quot;#ar-next&quot;);
      const batchButton = root.querySelector(&quot;#ar-run-100&quot;);
      const attemptCount = root.querySelector(&quot;#ar-attempt-count&quot;);
      const acceptedCount = root.querySelector(&quot;#ar-accepted-count&quot;);
      const cValue = root.querySelector(&quot;#ar-c-value&quot;);
      const rateValue = root.querySelector(&quot;#ar-rate&quot;);
      const detail = root.querySelector(&quot;#ar-detail&quot;);
      const acceptedOutput = root.querySelector(&quot;#ar-accepted-output&quot;);
      const batchSection = root.querySelector(&quot;#ar-batch&quot;);
      const histogram = root.querySelector(&quot;#ar-histogram&quot;);
      const efficiencyBody = root.querySelector(&quot;#ar-efficiency-body&quot;);
      const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);

      const attempts = [
        { u1: 0.10, u2: 0.30 },
        { u1: 0.52, u2: 0.80 },
        { u1: 0.90, u2: 0.25 },
        { u1: 0.30, u2: 0.55 },
        { u1: 0.74, u2: 0.70 },
        { u1: 0.60, u2: 0.40 }
      ];

      const proposals = {
        uniform: {
          label: &quot;Uniform(50,100)&quot;,
          domain: [48, 102],
          c: 2,
          g: y =&gt; y &gt;= 50 &amp;&amp; y &lt;= 100 ? 0.02 : 0,
          quantile: u =&gt; 50 + 50 * u
        },
        wide: {
          label: &quot;Uniform(40,110)&quot;,
          domain: [38, 112],
          c: 2.8,
          g: y =&gt; y &gt;= 40 &amp;&amp; y &lt;= 110 ? 1 / 70 : 0,
          quantile: u =&gt; 40 + 70 * u
        },
        beta: {
          label: &quot;scaled Beta(2,2)&quot;,
          domain: [48, 102],
          c: 4 / 3,
          g: y =&gt; {
            const z = (y - 50) / 50;
            return z &gt;= 0 &amp;&amp; z &lt;= 1 ? 0.12 * z * (1 - z) : 0;
          },
          quantile: u =&gt; {
            let lo = 0;
            let hi = 1;
            for (let i = 0; i &lt; 60; i += 1) {
              const mid = (lo + hi) / 2;
              const cdf = mid * mid * (3 - 2 * mid);
              if (cdf &lt; u) lo = mid;
              else hi = mid;
            }
            return 50 + 50 * (lo + hi) / 2;
          }
        }
      };

      let attemptIndex = -1;
      let accepted = [];
      let current = null;
      let animationToken = 0;
      let animationStart = 0;
      let batchResults = null;

      const f = y =&gt; {
        if (y &lt; 50 || y &gt; 100) return 0;
        return y &lt;= 75 ? (y - 50) / 625 : (100 - y) / 625;
      };

      const ns = &quot;http://www.w3.org/2000/svg&quot;;
      const make = (name, attrs = {}, value = &quot;&quot;) =&gt; {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, attr]) =&gt; node.setAttribute(key, String(attr)));
        if (value) node.textContent = value;
        return node;
      };

      const fmt = value =&gt; {
        const rounded = Math.round(value * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      };

      const reset = () =&gt; {
        animationToken += 1;
        attemptIndex = -1;
        accepted = [];
        current = null;
        batchResults = null;
        batchSection.hidden = true;
        histogram.innerHTML = &quot;&quot;;
        efficiencyBody.innerHTML = &quot;&quot;;
        batchButton.disabled = true;
        nextButton.disabled = false;
        nextButton.textContent = &quot;Show attempt 1&quot;;
        batchButton.textContent = &quot;Run 100 more for all g&quot;;
        attemptCount.textContent = &quot;0/6&quot;;
        acceptedCount.textContent = &quot;0&quot;;
        acceptedOutput.textContent = &quot;none yet&quot;;
        const p = proposals[proposalSelect.value];
        cValue.textContent = p.c.toFixed(2);
        rateValue.textContent = `${(100 / p.c).toFixed(1)}%`;
        detail.textContent = `${p.label}: ready for the same six uniform pairs.`;
        draw();
      };

      const draw = () =&gt; {
        const p = proposals[proposalSelect.value];
        const width = Math.max(320, Math.round(plot.getBoundingClientRect().width || 736));
        const height = width &lt; 500 ? 330 : 340;
        const margin = {
          top: 42,
          right: width &lt; 500 ? 18 : 24,
          bottom: 58,
          left: width &lt; 500 ? 54 : 68
        };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;
        const xMin = p.domain[0];
        const xMax = p.domain[1];
        const yMax = 0.046;
        const sx = x =&gt; margin.left + ((x - xMin) / (xMax - xMin)) * innerWidth;
        const sy = y =&gt; margin.top + innerHeight - (y / yMax) * innerHeight;

        plot.innerHTML = &quot;&quot;;
        const svg = make(&quot;svg&quot;, {
          viewBox: `0 0 ${width} ${height}`,
          role: &quot;img&quot;,
          &quot;aria-label&quot;: &quot;Target density, proposal density, acceptance envelope, and current accept-reject point&quot;
        });
        svg.appendChild(make(&quot;title&quot;, {}, &quot;Acceptance-rejection sampler&quot;));
        svg.appendChild(make(&quot;desc&quot;, {}, &quot;The triangular target density is compared with a selectable proposal and its scaled envelope. Each attempt drops a point from the envelope to its acceptance height.&quot;));

        svg.appendChild(make(&quot;rect&quot;, {
          x: margin.left,
          y: margin.top,
          width: innerWidth,
          height: innerHeight,
          fill: &quot;none&quot;,
          stroke: &quot;var(--border)&quot;,
          &quot;stroke-width&quot;: 1,

        [0, 0.02, 0.04].forEach(value =&gt; {

          x: margin.left + innerWidth / 2,

          &quot;text-anchor&quot;: &quot;middle&quot;,
          class: &quot;axis-title&quot;,

        }, &quot;Temperature y (°C)&quot;));
        svg.appendChild(make(&quot;text&quot;, {
          x: 15,
          y: margin.top + innerHeight / 2,
          &quot;text-anchor&quot;: &quot;middle&quot;,
          transform: `rotate(-90 15 ${margin.top + innerHeight / 2})`,
          class: &quot;axis-title&quot;,
          &quot;data-axis&quot;: &quot;y&quot;

        legendItems.forEach((item, i) =&gt; {

          const yy = legendY + (width &lt; 500 ? Math.floor(i / 2) * 19 : 0);
          svg.appendChild(make(&quot;line&quot;, {

            y1: yy,
            x2: x + 28,

        });

        accepted.forEach((item, i) =&gt; {
          svg.appendChild(make(&quot;circle&quot;, {
            cx: sx(item.y),
            cy: sy(f(item.y)),

        if (current) {

      const settleAttempt = () =&gt; {

      const drawHistogram = () =&gt; {

        const margin = { top: 52, right: 18, bottom: 53, left: width &lt; 500 ? 54 : 68 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

          });

        }));
        const maxBar = Math.max(...keys.flatMap(key =&gt; countsByKey[key].map(count =&gt;
          batchResults[key].length ? count / (batchResults[key].length * 5) : 0)));
        const yMax = Math.max(0.05, maxBar * 1.12);

        const svg = make(&quot;svg&quot;, {

        });
        svg.appendChild(make(&quot;title&quot;, {}, &quot;Accepted-temperature histograms&quot;));
        svg.appendChild(make(&quot;desc&quot;, {}, &quot;The three side-by-side histogram series share ten temperature bins from 50 to 100 degrees Celsius. The target density appears as a line.&quot;));
        svg.appendChild(make(&quot;rect&quot;, {
          x: margin.left,
          y: margin.top,
          width: innerWidth,
          height: innerHeight,
          fill: &quot;none&quot;,
          stroke: &quot;var(--border)&quot;,
          &quot;stroke-width&quot;: 1,
          &quot;data-chart-frame&quot;: &quot;&quot;
        }));
        const binWidthPx = innerWidth / 10;
        const barWidth = Math.max(2, (binWidthPx - 3) / 3);
        [0, 0.02, 0.04, 0.06, 0.08, 0.10, 0.12].filter(value =&gt; value &lt; yMax).forEach(value =&gt; {
          const yy = y(value);
          svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: yy, x2: margin.left + innerWidth, y2: yy, class: &quot;grid&quot; }));
          svg.appendChild(make(&quot;text&quot;, { x: margin.left - 8, y: yy + 4, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;secondary&quot; }, value.toFixed(2)));
        });
        [50, 60, 70, 80, 90, 100].forEach(value =&gt; {
          svg.appendChild(make(&quot;text&quot;, { x: x(value), y: y(0) + 20, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;secondary&quot; }, String(value)));
        });
        keys.forEach((key, seriesIndex) =&gt; {
          const values = batchResults[key];
          countsByKey[key].forEach((count, bin) =&gt; {
            const density = values.length ? count / (values.length * 5) : 0;
            const left = margin.left + bin * binWidthPx + 1.5 + seriesIndex * barWidth;
            svg.appendChild(make(&quot;rect&quot;, {

              y: y(density),
              width: barWidth,

        const targetPath = Array.from({ length: 101 }, (_, i) =&gt; {
          const value = 50 + i / 2;
          return `${i ? &quot;L&quot; : &quot;M&quot;}${x(value).toFixed(2)},${y(f(value)).toFixed(2)}`;
        }).join(&quot; &quot;);
        svg.appendChild(make(&quot;path&quot;, { d: targetPath, class: &quot;target&quot; }));
        const legends = [
          [&quot;Target f&quot;, &quot;target&quot;],
          [&quot;U(50,100)&quot;, &quot;hist-uniform&quot;],
          [&quot;U(40,110)&quot;, &quot;hist-wide&quot;],
          [&quot;Beta(2,2)&quot;, &quot;hist-beta&quot;]

        const legendWidth = (width - 16) / (width &lt; 500 ? 2 : 4);
        legends.forEach(([label, className], i) =&gt; {
          const col = width &lt; 500 ? i % 2 : i;
          const row = width &lt; 500 ? Math.floor(i / 2) : 0;
          const xx = 10 + col * legendWidth;
          const yy = 14 + row * 20;
          if (className === &quot;target&quot;) svg.appendChild(make(&quot;line&quot;, { x1: xx, y1: yy, x2: xx + 22, y2: yy, class: &quot;target&quot; }));
          else svg.appendChild(make(&quot;rect&quot;, { x: xx, y: yy - 5, width: 20, height: 10, class: className }));
          svg.appendChild(make(&quot;text&quot;, { x: xx + 28, y: yy + 4 }, label));
        });
        svg.appendChild(make(&quot;text&quot;, { x: margin.left + innerWidth / 2, y: height - 10, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;x&quot; }, &quot;Accepted temperature (°C)&quot;));
        svg.appendChild(make(&quot;text&quot;, { x: 15, y: margin.top + innerHeight / 2, &quot;text-anchor&quot;: &quot;middle&quot;, transform: `rotate(-90 15 ${margin.top + innerHeight / 2})`, class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;y&quot; }, &quot;Density&quot;));

      proposalSelect.addEventListener(&quot;change&quot;, reset);
      nextButton.addEventListener(&quot;click&quot;, runNext);
      batchButton.addEventListener(&quot;click&quot;, runBatch);
      const observer = new ResizeObserver(draw);
      observer.observe(plot);

&lt;script&gt;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

        }

    }

    }

  const handlePointerOpen = (event) =&gt; {

    }

    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

      }

  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {

    }
    const trigger = getTrigger(event.target);

    }

    const trigger = getTrigger(event.target);

    }
